<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97757"/>
      <stop offset="100%" style="stop-color:#C96B3E"/>
    </linearGradient>
  </defs>
  <!-- 背景円 -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <!-- Claude ロゴ風のひし形マーク -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- 上 -->
    <ellipse cx="128" cy="62" rx="13" ry="22" transform="rotate(-15 128 62)"/>
    <!-- 右上 -->
    <ellipse cx="185" cy="85" rx="13" ry="22" transform="rotate(30 185 85)"/>
    <!-- 右下 -->
    <ellipse cx="196" cy="155" rx="13" ry="22" transform="rotate(75 196 155)"/>
    <!-- 下 -->
    <ellipse cx="152" cy="200" rx="13" ry="22" transform="rotate(120 152 200)"/>
    <!-- 左下 -->
    <ellipse cx="92" cy="196" rx="13" ry="22" transform="rotate(165 92 196)"/>
    <!-- 左上 -->
    <ellipse cx="60" cy="148" rx="13" ry="22" transform="rotate(-150 60 148)"/>
  </g>
  <!-- 「2」バッジ -->
  <circle cx="200" cy="56" r="34" fill="#1A1A2E"/>
  <text x="200" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">2</text>
</svg>
